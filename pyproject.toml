[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tesi-gan"
version = "0.1.0"
description = "Codice sperimentale della tesi magistrale su IA generativa e creativita' artistica"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "numpy>=1.26",
  "pillow>=10.0",
  "hydra-core>=1.3",       # configurazioni componibili, niente iperparametri hardcoded
  "omegaconf>=2.3",
  "wandb>=0.16",           # tracciamento esperimenti
  "torchmetrics>=1.3",     # FID, Inception Score
  "tqdm>=4.66",
  "matplotlib>=3.8",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "ipykernel>=6.29",
  "jupyter",
]

[project.scripts]
tesi-gan = "tesi_gan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
