# ArtBench-10, ristretto a sei stili (ADR-0004).
#
# Liao, Li, Liu, Keutzer — The ArtBench Dataset, arXiv:2206.11404, 2022.
# Bilanciato per costruzione: 5.000 immagini di training per stile, quindi 30.000
# in totale sui sei selezionati. Nessun sottocampionamento necessario.
#
# Preparazione (sul pod, dentro il Network Volume — vedi data/README.md):
#   1. scarica la versione ImageFolder con split da
#      https://artbench.eecs.berkeley.edu/files/artbench-10-imagefolder-split.tar
#   2. scompattala in data/raw/
#   3. python -m tesi_gan.data.download --stili ukiyo_e renaissance baroque \
#          romanticism realism impressionism --per-style 5000 --resize 64 \
#          --licenza-verificata
#
# --resize 64 scrive le immagini gia' alla risoluzione di addestramento: ArtBench e'
# distribuito a 256x256 e senza ridimensionamento ogni epoca decodificherebbe JPEG
# quattro volte piu' grandi del necessario.
name: artbench
root: data/processed
image_size: 64
num_workers: 4
augment: true          # solo flip orizzontale: vedi la nota in data/dataset.py

# I sei stili di ADR-0004. Servono a `data.download` per selezionarli
# esplicitamente: con un dataset bilanciato non ha senso prendere "i piu'
# popolati", perche' sono tutti uguali.
stili:
  - ukiyo_e
  - renaissance
  - baroque
  - romanticism
  - realism
  - impressionism
