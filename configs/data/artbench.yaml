# ArtBench-10, ristretto a sei stili (ADR-0004).
#
# Liao, Li, Liu, Keutzer — The ArtBench Dataset, arXiv:2206.11404, 2022.
# Bilanciato per costruzione: 5.000 immagini di training per stile, quindi 30.000
# in totale sui sei selezionati. Nessun sottocampionamento necessario.
#
# Preparazione (sul pod, dentro il Network Volume — vedi data/README.md):
#   1. scarica la versione ImageFolder con split da
#      https://artbench.eecs.berkeley.edu/files/artbench-10-imagefolder-split.tar
#   2. scompattala in data/raw/
#   3. python -m tesi_gan.data.download --stili ukiyo_e renaissance baroque \
#          art_nouveau expressionism impressionism --per-style 5000 --resize 64 \
#          --licenza-verificata
#
# --resize 64 scrive le immagini gia' alla risoluzione di addestramento: ArtBench e'
# distribuito a 256x256 e senza ridimensionamento ogni epoca decodificherebbe JPEG
# quattro volte piu' grandi del necessario.
name: artbench
root: data/processed
image_size: 64
num_workers: 4
augment: true          # solo flip orizzontale: vedi la nota in data/dataset.py

# Split di RIFERIMENTO: il `test` ufficiale di ArtBench (1.000 immagini per stile),
# preparato separatamente in data/processed_test. Non si addestra mai su queste
# immagini. Serve a due cose:
#   - validare il giudice di stile su dati mai visti e sullo split pubblicato,
#     rendendo la sua accuratezza confrontabile con la letteratura;
#   - fornire la distribuzione di riferimento per il FID. Calcolarlo contro i dati
#     di addestramento premierebbe la memorizzazione: un generatore che riproducesse
#     il training set otterrebbe un FID ottimo senza generalizzare.
# Sul riferimento non si applica augmentation: una distribuzione aumentata non e'
# piu' la distribuzione dei dati reali.
reference_root: data/processed_test

# I sei stili di ADR-0004, rivisti il 2026-08-03 (D-017) sulla base della matrice
# di confusione del giudice. Servono a `data.download` per selezionarli
# esplicitamente: con un dataset bilanciato non ha senso prendere "i piu'
# popolati", perche' sono tutti uguali.
#
# ROMANTICISM e REALISM sono stati rimossi: il giudice li riconosceva al 26% e al
# 30% contro un caso puro del 16,7%, con errori sparsi su quattro classi. A 64x64
# non hanno un'identita' visiva propria, e la loro opacita' alzava il pavimento
# dell'entropia sui reali comprimendo lo spazio in cui misurare l'effetto CAN.
#
# ART_NOUVEAU ed EXPRESSIONISM li sostituiscono per distanza visiva: linea
# decorativa e campiture piatte il primo, colore violento e forme distorte il
# secondo.
#
# ATTENZIONE (V-008): l'espressionismo NON e' integralmente in pubblico dominio.
# Comprende autori morti dopo il 1955 le cui opere sono ancora protette. E' l'unica
# eccezione al criterio di D-014 e va dichiarata in tesi, non lasciata implicita.
stili:
  - ukiyo_e
  - renaissance
  - baroque
  - art_nouveau
  - expressionism
  - impressionism
