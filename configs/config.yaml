# ============================================================================
#  Configurazione radice (Hydra).
#  Un esperimento si lancia con:
#      python -m tesi_gan.cli train experiment=<nome>
#  Nessun valore qui dentro va replicato nel codice sorgente.
# ============================================================================
defaults:
  - model: dcgan
  - data: placeholder
  - _self_
  # `experiment` viene per ultimo cosi' che i suoi valori vincano sui default.
  # Gli esperimenti dell'impianto di ADR-0003 sono e1-dcgan-baseline e
  # e2-can-confronto: vanno lanciati con gli stessi parametri tranne il modello.
  - optional experiment: null

seed: 42
strict_determinism: false

training:
  epochs: 50
  batch_size: 64
  lr_generator: 2e-4
  lr_discriminator: 2e-4
  beta1: 0.5
  beta2: 0.999
  checkpoint_every: 5        # in epoche; alto rischio su sessioni cloud effimere
  label_smoothing: 0.0       # sui target reali; se > 0 va dichiarato in appendice

tracking:
  backend: wandb
  project: tesi-gan-creativita
  # `entity` e' lo USERNAME W&B (o il nome di un team), non un indirizzo email.
  # Verificalo su wandb.ai/settings: se non coincide, `wandb.init` fallisce e il
  # run prosegue NON tracciato (vedi il fallback in utils/tracking.py).
  entity: gianpaolo-dalini98
  # L'API key va SOLO nella variabile d'ambiente WANDB_API_KEY, mai qui.

# Giudice terzo dell'ambiguita' stilistica (ADR-0005). Si addestra UNA SOLA VOLTA
# sui dati reali e resta congelato per tutti i run e tutte le condizioni: e' cio'
# che rende le entropie confrontabili fra DCGAN e CAN.
style_judge:
  epochs: 15
  batch_size: 64
  lr: 2e-4
  val_fraction: 0.15
  # Seed proprio, indipendente da quello dei run: il giudice e' addestrato una
  # volta e non fa parte delle sei ripetizioni dell'impianto.
  seed: 1234

paths:
  data: data/processed
  # Percorso unico: non dipende da model.name ne' da seed, perche' il giudice e'
  # uno solo per tutto l'impianto.
  style_judge: experiments/style_judge
  # I checkpoint sono separati per condizione E per seed. Senza, il secondo run
  # sovrascriverebbe il primo: con tre seed per condizione (D-010) si perderebbero
  # cinque run su sei senza accorgersene.
  checkpoints: experiments/checkpoints/${model.name}-seed${seed}
  figures: thesis/figures/generated
  # PNG dei campioni per epoca. Separati per condizione e seed come i checkpoint,
  # altrimenti i sei run si sovrascriverebbero a vicenda.
  samples: experiments/samples/${model.name}-seed${seed}

hydra:
  run:
    dir: experiments/${now:%Y-%m-%d_%H-%M-%S}
