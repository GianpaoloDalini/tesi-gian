# ============================================================================
#  Configurazione radice (Hydra).
#  Un esperimento si lancia con:
#      python -m tesi_gan.cli train experiment=<nome>
#  Nessun valore qui dentro va replicato nel codice sorgente.
# ============================================================================
defaults:
  - model: dcgan
  - data: placeholder
  - _self_
  # `experiment` viene per ultimo cosi' che i suoi valori vincano sui default.
  # Gli esperimenti dell'impianto di ADR-0003 sono e1-dcgan-baseline e
  # e2-can-confronto: vanno lanciati con gli stessi parametri tranne il modello.
  - optional experiment: null

seed: 42
strict_determinism: false

# Barre di avanzamento. `null` = automatico: attive su terminale interattivo,
# disattivate quando l'output finisce in un file (es. `nohup ... > log.txt`),
# dove tqdm produrrebbe migliaia di righe illeggibili.
# Forzabile con `progress=true` o `progress=false` da riga di comando.
progress: null

training:
  epochs: 50
  batch_size: 64
  lr_generator: 2e-4
  lr_discriminator: 2e-4
  beta1: 0.5
  beta2: 0.999
  checkpoint_every: 5        # in epoche; alto rischio su sessioni cloud effimere
  label_smoothing: 0.0       # sui target reali; se > 0 va dichiarato in appendice

tracking:
  backend: wandb
  project: tesi-gan-creativita
  # `entity` e' lo USERNAME W&B (o il nome di un team), non un indirizzo email.
  # Lasciato a `null`, W&B usa l'entity predefinita associata alla API key: e' la
  # configurazione robusta, perche' non richiede di indovinare il nome.
  #
  # Verificato il 2026-08-03: con `gianpaolo-dalini98` wandb.init fallisce
  # ("entity not found during upsertBucket") e il run prosegue NON tracciato, quindi
  # non citabile in tesi (CLAUDE.md §6). Compilare solo per scrivere su un team.
  entity: null
  # L'API key va SOLO nella variabile d'ambiente WANDB_API_KEY, mai qui.

# Giudice terzo dell'ambiguita' stilistica (ADR-0005). Si addestra UNA SOLA VOLTA
# sui dati reali e resta congelato per tutti i run e tutte le condizioni: e' cio'
# che rende le entropie confrontabili fra DCGAN e CAN.
style_judge:
  epochs: 15
  batch_size: 64
  lr: 2e-4
  val_fraction: 0.15
  # Seed proprio, indipendente da quello dei run: il giudice e' addestrato una
  # volta e non fa parte delle sei ripetizioni dell'impianto.
  seed: 1234

paths:
  data: data/processed

  # ATTENZIONE: ogni percorso di output include la RISOLUZIONE, oltre a condizione
  # e seed. Senza, un impianto a 128 sovrascriverebbe quello a 64 senza errori e
  # senza avvisi, e la perdita si scoprirebbe settimane dopo davanti a una figura
  # che non torna. E' la stessa classe di errore gia' corretta due volte: prima sui
  # checkpoint per seed, poi sui nomi dei run W&B.
  #
  # Il giudice e' uno solo PER RISOLUZIONE. Entropie prodotte da classificatori
  # diversi non vanno nella stessa tabella (ADR-0005), e un giudice addestrato a
  # 64 non e' nemmeno applicabile a immagini 128.
  style_judge: experiments/style_judge-${data.image_size}
  checkpoints: experiments/checkpoints/${model.name}-${data.image_size}-seed${seed}
  samples: experiments/samples/${model.name}-${data.image_size}-seed${seed}
  figures: thesis/figures/generated

hydra:
  run:
    dir: experiments/${now:%Y-%m-%d_%H-%M-%S}
