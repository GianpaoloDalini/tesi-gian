# @package _global_
#
# E6 — Ablazione di controllo (non è una condizione dell'esperimento comparativo).
#
#   python -m tesi_gan.cli train experiment=e6-ablazione-can-peso-zero
#
# Identica a e2-can-confronto.yaml (stesso seed, stessi iperparametri, stessa
# risoluzione) tranne UNA riga: `model.style_ambiguity_weight: 0.0`. Con il peso
# a zero il termine di ambiguità sparisce dalla loss del generatore
# (training/losses.py::generator_loss). L'attesa al momento della scrittura era
# che la CAN si riducesse esattamente alla DCGAN. A livello di loss del
# generatore e' vero (tests/test_impianto.py::
# test_can_peso_zero_annulla_ambiguita_nel_generatore), ma il discriminatore
# conserva la testa di stile: l'esito del run (2026-08-12) non ha replicato la
# DCGAN, vedi V-010 in docs/registro-decisioni.md. Commento corretto il
# 2026-10-16; l'attesa originale resta riportata qui per trasparenza.
#
# Un solo seed basta: non misura una differenza fra condizioni, verifica che
# l'implementazione condivisa (ADR-0003) non introduca differenze spurie quando il
# meccanismo che dovrebbe fare la differenza è spento. Se FID/IS di questo run
# risultassero sistematicamente diversi da e1-dcgan-baseline seed=1, sarebbe un
# bug nell'implementazione condivisa, non un risultato da interpretare.
# ATTENZIONE (bug corretto qui, 2026-08-12): senza override esplicito, il percorso
# dei checkpoint (paths.checkpoints in config.yaml) si costruisce da
# ${model.name}-${data.image_size}-seed${seed}. Questo file non cambia model.name
# (resta "can", ereditato da configs/model/can.yaml), quindi senza le due righe
# `paths:` qui sotto questo esperimento scriverebbe nella STESSA cartella di
# e2-can-confronto seed=1 — sovrascrivendo silenziosamente i checkpoint della
# condizione sperimentale reale con quelli dell'ablazione di controllo. Verificare,
# se questo file e' stato lanciato prima di questa correzione, che
# experiments/checkpoints/can-<risoluzione>-seed1 non sia stato danneggiato.
defaults:
  - override /model: can
  - override /data: artbench

seed: 1

model:
  style_ambiguity_weight: 0.0

paths:
  checkpoints: experiments/checkpoints/e6-ablazione-${data.image_size}-seed${seed}
  samples: experiments/samples/e6-ablazione-${data.image_size}-seed${seed}

training:
  epochs: 100
  batch_size: 128
  lr_generator: 2e-4
  lr_discriminator: 2e-4
  beta1: 0.5
  beta2: 0.999
  checkpoint_every: 10
  label_smoothing: 0.1
